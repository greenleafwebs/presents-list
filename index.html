<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>プレゼント情報一覧</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 15px 40px;
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 26px;
    }

    /* ==========================================
       投稿一覧
       ========================================== */

    #posts {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .post {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .post-text {
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-text a {
      color: #1677cc;
      text-decoration: none;
    }

    .post-text a:hover {
      text-decoration: underline;
    }

    .keyword {
      color: red;
      font-weight: bold;
    }

    .post-x {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 12px;
      background: #000;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
    }

    .message {
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }

    /* ==========================================
       管理ボタン
       ========================================== */

    .admin-toggle {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .admin-toggle:hover {
      background: #333;
    }

    /* ==========================================
       管理画面
       ========================================== */

    #admin {
      display: none;
      margin-bottom: 20px;
    }

    .admin-section {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .admin-section h2 {
      margin: 0 0 15px;
      font-size: 19px;
    }

    .admin-section button {
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      cursor: pointer;
      margin-right: 5px;
      margin-bottom: 5px;
    }

    .add-button {
      background: #1677cc;
      color: #fff;
    }

    .edit-button {
      background: #eee;
      color: #333;
    }

    .delete-button {
      background: #d9534f;
      color: #fff;
    }

    .run-button {
      width: 100%;
      margin: 0;
      padding: 13px !important;
      background: #198754;
      color: #fff;
      font-size: 15px;
    }

    .run-button:hover {
      background: #157347;
    }

    .run-button:disabled {
      background: #999;
      cursor: wait;
    }

    .run-result {
      margin-top: 10px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.6;
      display: none;
    }

    .keyword-item,
    .account-item {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .keyword-item:last-child,
    .account-item:last-child {
      border-bottom: none;
    }

    .keyword-name {
      font-weight: bold;
      margin-right: 8px;
    }

    .account-name {
      font-weight: bold;
      font-size: 16px;
    }

    .account-url {
      margin-top: 4px;
      font-size: 12px;
      color: #777;
      word-break: break-all;
    }

    .enabled {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 7px;
      border-radius: 4px;
      background: #198754;
      color: #fff;
      font-size: 11px;
    }

    .disabled {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 7px;
      border-radius: 4px;
      background: #999;
      color: #fff;
      font-size: 11px;
    }

    .admin-login {
      display: none;
      margin-top: 20px;
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .admin-login input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .login-button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      background: #444;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .login-error {
      margin-top: 10px;
      color: #d9534f;
      font-size: 13px;
      display: none;
    }

    .logout-button {
      background: #777;
      color: #fff;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎁 プレゼント情報一覧</h1>


  <!-- ==========================================
       管理画面
       ========================================== -->

  <div id="admin-login" style="display:none; margin-bottom:15px; background:#fff; border-radius:10px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,0.08);">
    <h2 style="margin:0 0 12px; font-size:19px;">🔐 管理者ログイン</h2>
    <input
      type="password"
      id="adminPassword"
      placeholder="管理用パスワード"
      autocomplete="current-password"
      style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:16px; margin-bottom:8px;"
    >
    <button
      type="button"
      class="add-button"
      onclick="loginAdmin()"
      style="margin:0;"
    >
      ログイン
    </button>
    <div id="loginResult" style="margin-top:8px; font-size:13px;"></div>
  </div>

  <div id="adminLogin" class="admin-login">
    <h2 style="margin:0 0 12px; font-size:19px;">🔐 管理者ログイン</h2>
    <input
      type="password"
      id="adminPassword"
      placeholder="管理用パスワード"
      autocomplete="current-password"
      onkeydown="if(event.key === 'Enter') loginAdmin()"
    >
    <button
      type="button"
      class="login-button"
      onclick="loginAdmin()"
    >
      ログイン
    </button>
    <div id="loginError" class="login-error"></div>
  </div>

  <div id="admin">

    <button
      type="button"
      class="logout-button"
      onclick="logoutAdmin()"
    >
      🔒 ログアウト
    </button>

    <!-- RSS手動取得 -->
    <div class="admin-section">

      <h2>🔄 RSS取得</h2>

      <button
        type="button"
        class="run-button"
        id="runButton"
        onclick="runRss()"
      >
        🔄 今すぐ取得
      </button>

      <div
        id="runResult"
        class="run-result"
      ></div>

    </div>


    <!-- キーワード管理 -->
    <div class="admin-section">

      <h2>🔑 キーワード管理</h2>

      <button
        type="button"
        class="add-button"
        onclick="addKeyword()"
      >
        ＋ キーワード追加
      </button>

      <div id="keywords">
        <div class="message">
          読み込み中……
        </div>
      </div>

    </div>


    <!-- アカウント管理 -->
    <div class="admin-section">

      <h2>👤 アカウント管理</h2>

      <button
        type="button"
        class="add-button"
        onclick="addAccount()"
      >
        ＋ アカウント追加
      </button>

      <div id="accounts">
        <div class="message">
          読み込み中……
        </div>
      </div>

    </div>

  </div>


  <!-- ==========================================
       投稿一覧
       ========================================== -->

  <div id="posts">

    <div class="message">
      読み込み中……
    </div>

  </div>


  <!-- ==========================================
       管理ボタン
       ========================================== -->

  <button
    type="button"
    class="admin-toggle"
    onclick="toggleAdmin()"
  >
    ⚙️ 管理
  </button>

</div>


<script>

/* ==========================================
   投稿一覧
   ========================================== */

async function loadPosts() {

  const container =
    document.getElementById("posts");

  try {

    const response =
      await fetch("/api/posts");

    const data =
      await response.json();

    if (!data.success) {
      throw new Error("投稿取得に失敗しました");
    }

    if (!data.posts || data.posts.length === 0) {

      container.innerHTML =
        '<div class="message">投稿はありません。</div>';

      return;
    }

    const keywords =
      await getKeywordList();

    container.innerHTML =
      data.posts
        .map(post => {

          const text =
            formatPostText(
              post.text || "",
              post.post_url
            );

          return `
            <div class="post">

              <div class="post-text">
                ${highlightKeywords(
                  text,
                  keywords
                )}
              </div>

              <a
                class="post-x"
                href="${escapeHtml(post.post_url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Xで見る
              </a>

            </div>
          `;

        })
        .join("");

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<div class="message">
        投稿の読み込みに失敗しました。
      </div>`;
  }
}


/* ==========================================
   投稿本文整形
   ========================================== */

function formatPostText(text, postUrl) {

  const lines =
    text.split(/\r?\n/);

  return lines
    .map(line => {

      const trimmed =
        line.trim();

      if (
        trimmed.match(
          /^https?:\/\/\S+$/i
        )
      ) {
        return escapeHtml(trimmed);
      }

      return escapeHtml(line);

    })
    .join("<br>");
}


/* ==========================================
   キーワード取得
   ========================================== */

async function getKeywordList() {

  try {

    const response =
      await fetch("/api/keywords");

    const data =
      await response.json();

    if (!data.success) {
      return [];
    }

    return data.keywords
      .map(item => item.keyword)
      .filter(Boolean);

  } catch (error) {

    console.error(error);

    return [];
  }
}


/* ==========================================
   キーワード強調
   ========================================== */

function highlightKeywords(text, keywords) {

  let result = text;

  const sortedKeywords =
    [...keywords]
      .sort((a, b) =>
        b.length - a.length
      );

  for (const keyword of sortedKeywords) {

    if (!keyword) continue;

    const regex =
      new RegExp(
        escapeRegExp(keyword),
        "gi"
      );

    result =
      result.replace(
        regex,
        match =>
          `<span class="keyword">${match}</span>`
      );
  }

  return result;
}


/* ==========================================
   HTMLエスケープ
   ========================================== */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ==========================================
   正規表現エスケープ
   ========================================== */

function escapeRegExp(value) {

  return String(value)
    .replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );
}


/* ==========================================
   管理者認証
   ========================================== */

function getAdminPassword() {
  return sessionStorage.getItem("adminPassword") || "";
}

function adminHeaders(json = false) {
  const headers = {
    "X-Admin-Password": getAdminPassword()
  };

  if (json) {
    headers["Content-Type"] = "application/json";
  }

  return headers;
}

async function checkAdmin() {
  const password = getAdminPassword();
  if (!password) return false;

  try {
    const response = await fetch("/api/admin-check", {
      headers: {
        "X-Admin-Password": password
      }
    });

    return response.ok;
  } catch (error) {
    console.error(error);
    return false;
  }
}

async function loginAdmin() {
  const input = document.getElementById("adminPassword");
  const errorBox = document.getElementById("loginError");
  const password = input.value;

  if (!password) {
    errorBox.textContent = "パスワードを入力してください。";
    errorBox.style.display = "block";
    return;
  }

  errorBox.style.display = "none";
  sessionStorage.setItem("adminPassword", password);

  const ok = await checkAdmin();

  if (!ok) {
    sessionStorage.removeItem("adminPassword");
    errorBox.textContent = "パスワードが違います。";
    errorBox.style.display = "block";
    input.value = "";
    input.focus();
    return;
  }

  input.value = "";
  showAdmin();
}

function logoutAdmin() {
  sessionStorage.removeItem("adminPassword");
  document.getElementById("admin").style.display = "none";
  document.getElementById("adminLogin").style.display = "none";
  document.querySelector(".admin-toggle").textContent = "⚙️ 管理";
}

async function showAdmin() {
  document.getElementById("adminLogin").style.display = "none";
  document.getElementById("admin").style.display = "block";
  document.querySelector(".admin-toggle").textContent = "⚙️ 管理を閉じる";
  await loadKeywords();
  await loadAccounts();
}

async function toggleAdmin() {
  const admin = document.getElementById("admin");
  const login = document.getElementById("adminLogin");

  if (admin.style.display === "block") {
    admin.style.display = "none";
    document.querySelector(".admin-toggle").textContent = "⚙️ 管理";
    return;
  }

  if (await checkAdmin()) {
    showAdmin();
    return;
  }

  sessionStorage.removeItem("adminPassword");
  login.style.display = "block";
  document.getElementById("adminPassword").focus();
}


/* ==========================================
   🔄 RSS手動取得
   ========================================== */

async function runRss() {

  const button =
    document.getElementById("runButton");

  const resultBox =
    document.getElementById("runResult");

  button.disabled = true;

  button.textContent =
    "⏳ 取得中……";

  resultBox.style.display =
    "block";

  resultBox.textContent =
    "RSSを取得しています……";

  try {

    const response =
      await fetch(
        "/api/run",
        {
          method: "POST",
          headers: adminHeaders()
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      throw new Error(
        data.error ||
        "RSS取得に失敗しました"
      );
    }

    resultBox.innerHTML = `
      <strong>取得完了！</strong><br>
      アカウント：${data.accounts}件<br>
      RSS取得：${data.feeds}件<br>
      RSS記事：${data.rssItems}件<br>
      新規保存：${data.saved}件
    `;

    // 投稿一覧を更新
    await loadPosts();

  } catch (error) {

    console.error(error);

    resultBox.innerHTML = `
      <strong>取得に失敗しました。</strong><br>
      ${escapeHtml(error.message)}
    `;

  } finally {

    button.disabled = false;

    button.textContent =
      "🔄 今すぐ取得";
  }
}


/* ==========================================
   キーワード一覧
   ========================================== */

async function loadKeywords() {

  const container =
    document.getElementById("keywords");

  try {

    const response =
      await fetch("/api/keywords", {
        headers: adminHeaders()
      });

    const data =
      await response.json();

    if (!data.success) {
      throw new Error();
    }

    renderKeywords(data.keywords);

  } catch (error) {

    console.error(error);

    container.innerHTML =
      '<div class="message">読み込みに失敗しました。</div>';
  }
}


/* ==========================================
   キーワード表示
   ========================================== */

function renderKeywords(keywords) {

  const container =
    document.getElementById("keywords");

  if (
    !keywords ||
    keywords.length === 0
  ) {

    container.innerHTML =
      '<div class="message">キーワードはありません。</div>';

    return;
  }

  container.innerHTML =
    keywords
      .map(item => `
        <div class="keyword-item">

          <span class="keyword-name">
            ${escapeHtml(item.keyword)}
          </span>

          <button
            type="button"
            class="edit-button"
            onclick="editKeyword(${item.id})"
          >
            編集
          </button>

          <button
            type="button"
            class="delete-button"
            onclick="deleteKeyword(${item.id})"
          >
            削除
          </button>

        </div>
      `)
      .join("");
}


/* ==========================================
   キーワード追加
   ========================================== */

async function addKeyword() {

  const keyword =
    prompt("追加するキーワードを入力してください");

  if (!keyword) {
    return;
  }

  try {

    const response =
      await fetch(
        "/api/keywords",
        {
          method: "POST",
          headers: adminHeaders(true),
          body: JSON.stringify({
            keyword: keyword.trim()
          })
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      alert(
        data.error ||
        "追加に失敗しました"
      );

      return;
    }

    await loadKeywords();

  } catch (error) {

    console.error(error);

    alert("追加に失敗しました");
  }
}


/* ==========================================
   キーワード編集
   ========================================== */

async function editKeyword(id) {

  const currentKeywords =
    await fetch("/api/keywords")
      .then(response =>
        response.json()
      );

  const item =
    currentKeywords.keywords
      .find(k => k.id === id);

  if (!item) {
    alert("キーワードが見つかりません");
    return;
  }

  const keyword =
    prompt(
      "新しいキーワードを入力してください",
      item.keyword
    );

  if (!keyword) {
    return;
  }

  try {

    const response =
      await fetch(
        `/api/keywords/${id}`,
        {
          method: "PUT",
          headers: adminHeaders(true),
          body: JSON.stringify({
            keyword: keyword.trim()
          })
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      alert(
        data.error ||
        "変更に失敗しました"
      );

      return;
    }

    await loadKeywords();
    await loadPosts();

  } catch (error) {

    console.error(error);

    alert("変更に失敗しました");
  }
}


/* ==========================================
   キーワード削除
   ========================================== */

async function deleteKeyword(id) {

  if (
    !confirm(
      "このキーワードを削除しますか？"
    )
  ) {
    return;
  }

  try {

    const response =
      await fetch(
        `/api/keywords/${id}`,
        {
          method: "DELETE",
          headers: adminHeaders()
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      alert(
        data.error ||
        "削除に失敗しました"
      );

      return;
    }

    await loadKeywords();
    await loadPosts();

  } catch (error) {

    console.error(error);

    alert("削除に失敗しました");
  }
}


/* ==========================================
   アカウント一覧
   ========================================== */

async function loadAccounts() {

  const container =
    document.getElementById("accounts");

  try {

    const response =
      await fetch("/api/accounts", {
        headers: adminHeaders()
      });

    const data =
      await response.json();

    if (!data.success) {
      throw new Error();
    }

    renderAccounts(data.accounts);

  } catch (error) {

    console.error(error);

    container.innerHTML =
      '<div class="message">読み込みに失敗しました。</div>';
  }
}


/* ==========================================
   アカウント表示
   ========================================== */

function renderAccounts(accounts) {

  const container =
    document.getElementById("accounts");

  if (
    !accounts ||
    accounts.length === 0
  ) {

    container.innerHTML =
      '<div class="message">アカウントはありません。</div>';

    return;
  }

  container.innerHTML =
    accounts
      .map(account => {

        const status =
          account.enabled
            ? '<span class="enabled">有効</span>'
            : '<span class="disabled">無効</span>';

        return `
          <div class="account-item">

            <div class="account-name">
              ${escapeHtml(account.username)}
              ${status}
            </div>

            <div class="account-url">
              X：
              ${escapeHtml(account.x_url || "")}
            </div>

            <div class="account-url">
              RSS：
              ${escapeHtml(account.rss_url || "")}
            </div>

            <div style="margin-top:8px;">

              <button
                type="button"
                class="edit-button"
                onclick="editAccount(${account.id})"
              >
                編集
              </button>

              <button
                type="button"
                class="delete-button"
                onclick="deleteAccount(${account.id})"
              >
                削除
              </button>

            </div>

          </div>
        `;

      })
      .join("");
}


/* ==========================================
   アカウント追加
   ========================================== */

async function addAccount() {

  const username =
    prompt(
      "ユーザー名を入力してください"
    );

  if (!username) {
    return;
  }

  const xUrl =
    prompt(
      "X URLを入力してください",
      `https://x.com/${username.trim()}`
    );

  if (xUrl === null) {
    return;
  }

  const rssUrl =
    prompt(
      "RSS URLを入力してください"
    );

  if (rssUrl === null) {
    return;
  }

  try {

    const response =
      await fetch(
        "/api/accounts",
        {
          method: "POST",
          headers: adminHeaders(true),
          body: JSON.stringify({
            username:
              username.trim(),

            x_url:
              xUrl.trim(),

            rss_url:
              rssUrl.trim(),

            enabled: 1
          })
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      alert(
        data.error ||
        "追加に失敗しました"
      );

      return;
    }

    await loadAccounts();

  } catch (error) {

    console.error(error);

    alert("追加に失敗しました");
  }
}


/* ==========================================
   アカウント編集
   ========================================== */

async function editAccount(id) {

  try {

    const response =
      await fetch("/api/accounts", {
        headers: adminHeaders()
      });

    const data =
      await response.json();

    const account =
      data.accounts
        .find(a => a.id === id);

    if (!account) {

      alert(
        "アカウントが見つかりません"
      );

      return;
    }

    const username =
      prompt(
        "ユーザー名",
        account.username
      );

    if (username === null) {
      return;
    }

    const xUrl =
      prompt(
        "X URL",
        account.x_url || ""
      );

    if (xUrl === null) {
      return;
    }

    const rssUrl =
      prompt(
        "RSS URL",
        account.rss_url || ""
      );

    if (rssUrl === null) {
      return;
    }

    const enabled =
      confirm(
        "このアカウントを有効にしますか？\n\nOK：有効\nキャンセル：無効"
      );

    const updateResponse =
      await fetch(
        `/api/accounts/${id}`,
        {
          method: "PUT",
          headers: adminHeaders(true),
          body: JSON.stringify({

            username:
              username.trim(),

            x_url:
              xUrl.trim(),

            rss_url:
              rssUrl.trim(),

            enabled:
              enabled ? 1 : 0

          })
        }
      );

    const result =
      await updateResponse.json();

    if (!result.success) {

      alert(
        result.error ||
        "変更に失敗しました"
      );

      return;
    }

    await loadAccounts();

  } catch (error) {

    console.error(error);

    alert("変更に失敗しました");
  }
}


/* ==========================================
   アカウント削除
   ========================================== */

async function deleteAccount(id) {

  if (
    !confirm(
      "このアカウントを削除しますか？"
    )
  ) {
    return;
  }

  try {

    const response =
      await fetch(
        `/api/accounts/${id}`,
        {
          method: "DELETE",
          headers: adminHeaders()
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      alert(
        data.error ||
        "削除に失敗しました"
      );

      return;
    }

    await loadAccounts();

  } catch (error) {

    console.error(error);

    alert("削除に失敗しました");
  }
}


/* ==========================================
   初期読み込み
   ========================================== */

async function init() {

  await loadKeywords();

  await loadPosts();
}

init();
