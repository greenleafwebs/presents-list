<script>

/* ==========================================
   投稿一覧
   ========================================== */

async function loadPosts() {

  const container =
    document.getElementById("posts");

  try {

    const response =
      await fetch("/api/posts");

    const data =
      await response.json();

    if (!data.success) {
      throw new Error("投稿取得に失敗しました");
    }

    if (!data.posts || data.posts.length === 0) {

      container.innerHTML =
        '<div class="message">投稿はありません。</div>';

      return;
    }

    const keywords =
      await getKeywordList();

    container.innerHTML =
      data.posts
        .map(post => {

          const formatted =
            formatPostText(
              post.text || ""
            );

          return `
            <div class="post">

              ${
                formatted.titleUrl
                  ? `
                    <a
                      class="post-title"
                      href="${escapeHtml(formatted.titleUrl)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      ${highlightKeywords(
                        formatted.title,
                        keywords
                      )}
                    </a>
                  `
                  : `
                    <div class="post-title">
                      ${highlightKeywords(
                        formatted.title,
                        keywords
                      )}
                    </div>
                  `
              }

              ${
                formatted.body
                  ? `
                    <div class="post-text">${highlightKeywords(formatted.body, keywords)}</div>
                  `
                  : ""
              }

              ${
                post.post_url
                  ? `
                    <a
                      class="post-x"
                      href="${escapeHtml(post.post_url)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Xで見る
                    </a>
                  `
                  : ""
              }

            </div>
          `;

        })
        .join("");

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<div class="message">
        投稿の読み込みに失敗しました。
      </div>`;
  }
}


/* ==========================================
   投稿本文整形
   ========================================== */

function cleanLine(value) {

  return String(value || "")
    /*
     * 通常の空白
     * 全角空白
     * NBSP
     * ゼロ幅スペース
     * BOM
     * Word Joiner
     * などを先頭・末尾から除去
     */
    .replace(
      /^[\s\u00A0\u1680\u180E\u2000-\u200B\u2028\u2029\u202F\u205F\u2060\u3000\uFEFF]+/,
      ""
    )
    .replace(
      /[\s\u00A0\u1680\u180E\u2000-\u200B\u2028\u2029\u202F\u205F\u2060\u3000\uFEFF]+$/,
      ""
    );
}


function formatPostText(text) {

  const lines =
    String(text || "")
      .split(/\r?\n/);

  let title = "";
  let titleUrl = "";

  const bodyLines = [];


  /*
   * 1行目をタイトルとして処理
   */

  if (lines.length > 0) {

    let firstLine =
      cleanLine(lines.shift());


    /*
     * Markdown形式
     *
     * [**タイトル**](https://kns.how/xxxx)
     */

    const markdownMatch =
      firstLine.match(
        /^\[\s*\*{0,2}(.*?)\*{0,2}\s*\]\(\s*(https?:\/\/kns\.how\/[^\s)]+)\s*\)$/i
      );


    if (markdownMatch) {

      title =
        cleanLine(
          markdownMatch[1]
        )
        .replace(
          /^\*+|\*+$/g,
          ""
        )
        .trim();

      titleUrl =
        markdownMatch[2];

    } else {

      /*
       * 通常のタイトル
       */

      title =
        firstLine
          .replace(
            /^\*+|\*+$/g,
            ""
          )
          .trim();

    }

  }


  /*
   * 本文処理
   */

  for (const originalLine of lines) {

    let line =
      cleanLine(originalLine);


    /*
     * 空行は除去
     */

    if (!line) {
      continue;
    }


    /*
     * コードブロック記号が
     * 投稿データに混入していても除去
     */

    if (
      line === "`" ||
      line === "``" ||
      line === "```"
    ) {
      continue;
    }


    /*
     * kns.how のURL単独行
     */

    const urlMatch =
      line.match(
        /^https?:\/\/kns\.how\/[^\s]+$/i
      );


    if (urlMatch) {

      if (!titleUrl) {
        titleUrl =
          urlMatch[0];
      }

      continue;
    }


    /*
     * 本文中の kns.how URLを除去
     */

    line =
      line.replace(
        /https?:\/\/kns\.how\/[^\s<>"')`]+/gi,
        ""
      );


    /*
     * Markdownリンクを処理
     */

    line =
      line.replace(
        /\[\s*\*{0,2}(.*?)\*{0,2}\s*\]\(\s*https?:\/\/kns\.how\/[^\s)]+\s*\)/gi,
        "$1"
      );


    /*
     * 行頭・行末の空白を再度除去
     */

    line =
      cleanLine(line);


    /*
     * 行頭・行末に残ったバッククォートを除去
     */

    line =
      line
        .replace(
          /^`+/,
          ""
        )
        .replace(
          /`+$/,
          ""
        );


    line =
      cleanLine(line);


    if (line) {

      bodyLines.push(
        escapeHtml(line)
      );

    }

  }


  return {

    title:
      escapeHtml(title),

    titleUrl:
      titleUrl,

    body:
      bodyLines.join("<br>")

  };
}


/* ==========================================
   キーワード取得
   ========================================== */

async function getKeywordList() {

  try {

    const response =
      await fetch("/api/keywords");

    const data =
      await response.json();

    if (!data.success) {
      return [];
    }

    return data.keywords
      .map(item => item.keyword)
      .filter(Boolean);

  } catch (error) {

    console.error(error);

    return [];
  }
}


/* ==========================================
   キーワード強調
   ========================================== */

function highlightKeywords(text, keywords) {

  let result =
    text;

  const sortedKeywords =
    [...keywords]
      .sort(
        (a, b) =>
          b.length - a.length
      );

  for (const keyword of sortedKeywords) {

    if (!keyword) {
      continue;
    }

    const regex =
      new RegExp(
        escapeRegExp(keyword),
        "gi"
      );

    result =
      result.replace(
        regex,
        match =>
          `<span class="keyword">${match}</span>`
      );
  }

  return result;
}


/* ==========================================
   HTMLエスケープ
   ========================================== */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* ==========================================
   正規表現エスケープ
   ========================================== */

function escapeRegExp(value) {

  return String(value)
    .replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );
}


/* ==========================================
   管理画面表示
   ========================================== */

async function showAdmin() {

  const admin =
    document.getElementById("admin");

  if (admin.style.display === "block") {
    admin.style.display = "none";
    document.querySelector(".admin-toggle").textContent =
      "⚙️ 管理";
    return;
  }

  admin.style.display = "block";

  document.querySelector(".admin-toggle").textContent =
    "⚙️ 管理を閉じる";

  await loadKeywords();
  await loadAccounts();
}


function toggleAdmin() {
  showAdmin();
}


/* ==========================================
   RSS手動取得
   ========================================== */

async function runRss() {

  const button =
    document.getElementById(
      "runButton"
    );

  const resultBox =
    document.getElementById(
      "runResult"
    );


  button.disabled =
    true;

  button.textContent =
    "⏳ 取得中……";


  resultBox.style.display =
    "block";

  resultBox.textContent =
    "RSSを取得しています……";


  try {

    const response =
      await fetch(
        "/api/run",
        { method: "POST" }
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        "RSS取得に失敗しました"
      );
    }


    resultBox.innerHTML = `
      <strong>取得完了！</strong><br>
      アカウント：${data.accounts}件<br>
      RSS取得：${data.feeds}件<br>
      RSS記事：${data.rssItems}件<br>
      新規保存：${data.saved}件
    `;


    await loadPosts();


  } catch (error) {

    console.error(error);

    resultBox.innerHTML = `
      <strong>取得に失敗しました。</strong><br>
      ${escapeHtml(error.message)}
    `;


  } finally {

    button.disabled =
      false;

    button.textContent =
      "🔄 今すぐ取得";
  }
}


/* ==========================================
   キーワード一覧
   ========================================== */

async function loadKeywords() {

  const container =
    document.getElementById(
      "keywords"
    );


  try {

    const response =
      await fetch(
        "/api/keywords",
        {
        }
      );


    const data =
      await response.json();


    if (!data.success) {
      throw new Error();
    }


    renderKeywords(
      data.keywords
    );


  } catch (error) {

    console.error(error);

    container.innerHTML =
      '<div class="message">読み込みに失敗しました。</div>';
  }
}


/* ==========================================
   キーワード表示
   ========================================== */

function renderKeywords(keywords) {

  const container =
    document.getElementById(
      "keywords"
    );


  if (
    !keywords ||
    keywords.length === 0
  ) {

    container.innerHTML =
      '<div class="message">キーワードはありません。</div>';

    return;
  }


  container.innerHTML =
    keywords
      .map(item => `
        <div class="keyword-item">

          <span class="keyword-name">
            ${escapeHtml(item.keyword)}
          </span>

          <button
            type="button"
            class="edit-button"
            onclick="editKeyword(${item.id})"
          >
            編集
          </button>

          <button
            type="button"
            class="delete-button"
            onclick="deleteKeyword(${item.id})"
          >
            削除
          </button>

        </div>
      `)
      .join("");
}


/* ==========================================
   キーワード追加
   ========================================== */

async function addKeyword() {

  const keyword =
    prompt(
      "追加するキーワードを入力してください"
    );


  if (!keyword) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/keywords",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body:
            JSON.stringify({
              keyword:
                keyword.trim()
            })
        }
      );


    const data =
      await response.json();


    if (!data.success) {

      alert(
        data.error ||
        "追加に失敗しました"
      );

      return;
    }


    await loadKeywords();


  } catch (error) {

    console.error(error);

    alert(
      "追加に失敗しました"
    );
  }
}


/* ==========================================
   キーワード編集
   ========================================== */

async function editKeyword(id) {

  try {

    const response =
      await fetch(
        "/api/keywords"
      );


    const data =
      await response.json();


    const item =
      data.keywords
        .find(
          k => k.id === id
        );


    if (!item) {

      alert(
        "キーワードが見つかりません"
      );

      return;
    }


    const keyword =
      prompt(
        "新しいキーワードを入力してください",
        item.keyword
      );


    if (!keyword) {
      return;
    }


    const updateResponse =
      await fetch(
        `/api/keywords/${id}`,
        {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body:
            JSON.stringify({
              keyword:
                keyword.trim()
            })
        }
      );


    const result =
      await updateResponse.json();


    if (!result.success) {

      alert(
        result.error ||
        "変更に失敗しました"
      );

      return;
    }


    await loadKeywords();

    await loadPosts();


  } catch (error) {

    console.error(error);

    alert(
      "変更に失敗しました"
    );
  }
}


/* ==========================================
   キーワード削除
   ========================================== */

async function deleteKeyword(id) {

  if (
    !confirm(
      "このキーワードを削除しますか？"
    )
  ) {
    return;
  }


  try {

    const response =
      await fetch(
        `/api/keywords/${id}`,
        { method: "POST" }
      );


    const data =
      await response.json();


    if (!data.success) {

      alert(
        data.error ||
        "削除に失敗しました"
      );

      return;
    }


    await loadKeywords();

    await loadPosts();


  } catch (error) {

    console.error(error);

    alert(
      "削除に失敗しました"
    );
  }
}

  const container =
    document.getElementById(
      "accounts"
    );


  try {

    const response =
      await fetch(
        "/api/accounts",
        {
        }
      );

    if (!data.success) {
      throw new Error();
    }

/* ==========================================
   アカウント表示
   ========================================== */

function renderAccounts(accounts) {

  const container =
    document.getElementById(
      "accounts"
    );


  if (
    !accounts ||
    accounts.length === 0
  ) {

    container.innerHTML =
      '<div class="message">アカウントはありません。</div>';

    return;
  }


  container.innerHTML =
    accounts
      .map(account => {

        const status =
          account.enabled
            ? '<span class="enabled">有効</span>'
            : '<span class="disabled">無効</span>';


        return `
          <div class="account-item">

            <div class="account-name">
              ${escapeHtml(
                account.username
              )}
              ${status}
            </div>

            <div class="account-url">
              X：
              ${escapeHtml(
                account.x_url || ""
              )}
            </div>

            <div class="account-url">
              RSS：
              ${escapeHtml(
                account.rss_url || ""
              )}
            </div>

            <div style="margin-top:8px;">

              <button
                type="button"
                class="edit-button"
                onclick="editAccount(${account.id})"
              >
                編集
              </button>

              <button
                type="button"
                class="delete-button"
                onclick="deleteAccount(${account.id})"
              >
                削除
              </button>

            </div>

          </div>
        `;

      })
      .join("");
}


/* ==========================================
   アカウント追加
   ========================================== */

async function addAccount() {

  const username =
    prompt(
      "ユーザー名を入力してください"
    );


  if (!username) {
    return;
  }


  const xUrl =
    prompt(
      "X URLを入力してください",
      `https://x.com/${username.trim()}`
    );


  if (xUrl === null) {
    return;
  }


  const rssUrl =
    prompt(
      "RSS URLを入力してください"
    );


  if (rssUrl === null) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/accounts",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body:
            JSON.stringify({

              username:
                username.trim(),

              x_url:
                xUrl.trim(),

              rss_url:
                rssUrl.trim(),

              enabled:
                1

            })
        }
      );


    const data =
      await response.json();


    if (!data.success) {

      alert(
        data.error ||
        "追加に失敗しました"
      );

      return;
    }


    await loadAccounts();


  } catch (error) {

    console.error(error);

    alert(
      "追加に失敗しました"
    );
  }
}

   アカウント編集
   ========================================== */

async function editAccount(id) {

  try {

    const response =
      await fetch(
        "/api/accounts",
        {
        }
      );


    const data =
      await response.json();


    const account =
      data.accounts
        .find(
          a => a.id === id
        );


    if (!account) {

      alert(
        "アカウントが見つかりません"
      );

      return;
    }


    const username =
      prompt(
        "ユーザー名",
        account.username
      );


    if (username === null) {
      return;
    }


    const xUrl =
      prompt(
        "X URL",
        account.x_url || ""
      );


    if (xUrl === null) {
      return;
    }


    const rssUrl =
      prompt(
        "RSS URL",
        account.rss_url || ""
      );


    if (rssUrl === null) {
      return;
    }


    const enabled =
      confirm(
        "このアカウントを有効にしますか？\n\nOK：有効\nキャンセル：無効"
      );


    const updateResponse =
      await fetch(
        `/api/accounts/${id}`,
        {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body:
            JSON.stringify({

              username:
                username.trim(),

              x_url:
                xUrl.trim(),

              rss_url:
                rssUrl.trim(),

              enabled:
                enabled ? 1 : 0

            })
        }
      );


    const result =
      await updateResponse.json();


    if (!result.success) {

      alert(
        result.error ||
        "変更に失敗しました"
      );

      return;
    }


    await loadAccounts();


  } catch (error) {

    console.error(error);

    alert(
      "変更に失敗しました"
    );
  }
}


/* ==========================================
   アカウント削除
   ========================================== */

async function deleteAccount(id) {

  if (
    !confirm(
      "このアカウントを削除しますか？"
    )
  ) {
    return;
  }


  try {

    const response =
      await fetch(
        `/api/accounts/${id}`,
        { method: "POST" }
      );


    const data =
      await response.json();


    if (!data.success) {

      alert(
        data.error ||
        "削除に失敗しました"
      );

      return;
    }


    await loadAccounts();


  } catch (error) {

    console.error(error);

    alert(
      "削除に失敗しました"
    );
  }
}


/* ==========================================
   初期読み込み
   ========================================== */

async function init() {

  await loadPosts();
}

init();
